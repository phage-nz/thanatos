[package]
name = "thanatos_shared"
version = "0.1.0"
edition = "2021"

[lib]
name = "thanatos_shared"
crate-type = ["cdylib"]

[dependencies]
thanatos = { path = "..", default-features = false }
ctor = { version = "0.4.2", optional = true }

[features]
onload = ["dep:ctor"]
user = []
http = ["thanatos/http"]
cloudflare = ["thanatos/cloudflare"]
